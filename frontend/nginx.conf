server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Docker-embedded DNS resolver ──────────────────────────────────────────
    # 127.0.0.11 is Docker's internal DNS server.
    # Using a variable for the upstream forces nginx to resolve the hostname
    # at request time instead of at startup — prevents "host not found" crash
    # when the frontend container starts before (or independently of) the backend.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json image/svg+xml;
    gzip_min_length 1024;

    # ── Static assets — aggressive caching (Vite adds content hash to filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── API proxy → backend service ───────────────────────────────────────────
    location /api/ {
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Health endpoint proxy ──────────────────────────────────────────────────
    location /health {
        proxy_pass         $backend/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── SPA fallback — all other routes serve index.html ──────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
