name: Build and Push to ACR

on:
  push:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login "${{ secrets.ACR_LOGIN_SERVER }}" \
            -u "${{ secrets.ACR_USERNAME }}" --password-stdin

      # ── Single combined image ─────────────────────────────────────────────
      # Stage 1 (node-builder) : npm ci + vite build  → dist/
      # Stage 2 (py-deps)      : pip install           → site-packages
      # Stage 3 (runtime)      : ODBC 18 + app + dist  → one runnable image
      - name: Build and Push
        run: |
          docker build \
            -t "${{ secrets.ACR_LOGIN_SERVER }}/sat-app:latest" \
            -t "${{ secrets.ACR_LOGIN_SERVER }}/sat-app:${{ github.sha }}" \
            -f Dockerfile \
            .
          docker push "${{ secrets.ACR_LOGIN_SERVER }}/sat-app:latest"
          docker push "${{ secrets.ACR_LOGIN_SERVER }}/sat-app:${{ github.sha }}"
