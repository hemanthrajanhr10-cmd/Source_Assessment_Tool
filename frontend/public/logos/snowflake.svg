<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Snowflake logo — six-pointed star/snowflake shape in brand cyan-blue -->
  <defs>
    <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#29B5E8"/>
      <stop offset="100%" stop-color="#0099CC"/>
    </linearGradient>
  </defs>
  <!-- Vertical bar -->
  <rect x="21.5" y="4" width="5" height="40" rx="2.5" fill="url(#sg)"/>
  <!-- Diagonal bars -->
  <rect x="4" y="19.5" width="40" height="5" rx="2.5" fill="url(#sg)" transform="rotate(0 24 24)"/>
  <rect x="4" y="19.5" width="40" height="5" rx="2.5" fill="url(#sg)" transform="rotate(60 24 24)"/>
  <rect x="4" y="19.5" width="40" height="5" rx="2.5" fill="url(#sg)" transform="rotate(-60 24 24)"/>
  <!-- Arms tips (small diamonds) -->
  <rect x="20.5" y="3" width="7" height="7" rx="2" fill="#29B5E8" transform="rotate(45 24 6.5)"/>
  <rect x="20.5" y="3" width="7" height="7" rx="2" fill="#29B5E8" transform="rotate(45 24 6.5) translate(0 35)"/>
  <!-- center circle -->
  <circle cx="24" cy="24" r="4.5" fill="white"/>
  <circle cx="24" cy="24" r="3" fill="#29B5E8"/>
</svg>
