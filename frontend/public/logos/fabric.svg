<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Microsoft Fabric logo — gradient diamond/fabric pattern -->
  <defs>
    <linearGradient id="fg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0078D4"/>
      <stop offset="100%" stop-color="#00BCF2"/>
    </linearGradient>
    <linearGradient id="fg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00BCF2"/>
      <stop offset="100%" stop-color="#50E6FF"/>
    </linearGradient>
    <linearGradient id="fg3" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0078D4"/>
      <stop offset="100%" stop-color="#0F3058"/>
    </linearGradient>
  </defs>
  <!-- Four quadrant squares arranged in a 2x2 grid to form Fabric F shape -->
  <rect x="6" y="6" width="16" height="16" rx="3" fill="url(#fg1)"/>
  <rect x="26" y="6" width="16" height="16" rx="3" fill="url(#fg2)"/>
  <rect x="6" y="26" width="16" height="16" rx="3" fill="url(#fg3)"/>
  <rect x="26" y="26" width="16" height="16" rx="3" fill="url(#fg1)" opacity="0.75"/>
  <!-- white F letter overlay -->
  <text x="24" y="33" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="22" fill="white" opacity="0.15">F</text>
</svg>
