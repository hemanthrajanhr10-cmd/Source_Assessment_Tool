name: Build and Push to ACR

on:
  push:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4          # v4 — Node.js 20 deprecation fix

      - name: Log in to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login "${{ secrets.ACR_LOGIN_SERVER }}" \
            -u "${{ secrets.ACR_USERNAME }}" --password-stdin

      # ── Backend ─────────────────────────────────────────────────────────────
      # Dockerfile is at the project ROOT (not ./backend/)
      # Context is the repo root so app/ and requirements.txt are reachable
      - name: Build and Push Backend
        run: |
          docker build \
            -t "${{ secrets.ACR_LOGIN_SERVER }}/backend:latest" \
            -t "${{ secrets.ACR_LOGIN_SERVER }}/backend:${{ github.sha }}" \
            -f Dockerfile \
            .
          docker push "${{ secrets.ACR_LOGIN_SERVER }}/backend:latest"
          docker push "${{ secrets.ACR_LOGIN_SERVER }}/backend:${{ github.sha }}"

      # ── Frontend ─────────────────────────────────────────────────────────────
      # Dockerfile is at ./frontend/Dockerfile
      # Context is ./frontend/ so package.json and src/ are reachable
      - name: Build and Push Frontend
        run: |
          docker build \
            -t "${{ secrets.ACR_LOGIN_SERVER }}/frontend:latest" \
            -t "${{ secrets.ACR_LOGIN_SERVER }}/frontend:${{ github.sha }}" \
            -f frontend/Dockerfile \
            ./frontend
          docker push "${{ secrets.ACR_LOGIN_SERVER }}/frontend:latest"
          docker push "${{ secrets.ACR_LOGIN_SERVER }}/frontend:${{ github.sha }}"
