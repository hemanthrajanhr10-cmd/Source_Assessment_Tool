name: Build & Push to ACR

on:
  push:
    branches:
      - dev
      - main

jobs:
  build-and-push:
    name: Build Image & Push to ACR
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx (enables BuildKit — required for cache-from/cache-to)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Log in to Azure Container Registry
      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 4. Build & push — tags :latest and :<sha>
      #    cache-from/to: type=gha reuses GitHub Actions cache across runs
      #    (dramatically faster rebuilds when only app code changes)
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/sat-app:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/sat-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. Print summary
      - name: Summary
        run: |
          echo "Image pushed: ${{ secrets.ACR_LOGIN_SERVER }}/sat-app:${{ github.sha }}"
          echo "Azure Web App will restart automatically via ACR webhook."
